version: 2

# Four ecosystems live in this repo. The three Python projects each ship a
# uv.lock and CI runs `uv run --locked`, so they use the `uv` ecosystem rather
# than `pip` - `pip` would leave uv.lock untouched and every PR would fail the
# --locked check.
#
# Every ecosystem groups its minor and patch bumps into a single weekly PR so
# routine dependency churn costs one review instead of dozens. Major bumps stay
# ungrouped and arrive as individual PRs, because those are the ones that
# actually need reading.
updates:
  - package-ecosystem: "uv"
    directory: "/firmware"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      firmware-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pipeline-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/integration"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      integration-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      app-minor-and-patch:
        update-types: ["minor", "patch"]
    # These versions are owned by the Expo SDK, not by semver: each SDK release
    # pins the react, react-native and native-module versions its prebuilt
    # native code was compiled against, and `npx expo install --check` flags any
    # drift. Packages the SDK pins to an exact version are fully ignored, since
    # even a patch bump drifts from the pin; they only move via
    # `npx expo install --fix`. Packages the SDK pins to a tilde range still get
    # patch bumps, but a minor bump of any of them is an SDK upgrade in disguise.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # No longer a direct dependency (@testing-library/react-native 14 uses
      # test-renderer), but jest-expo still pins it to the SDK's React version,
      # so keep a transitive security bump from drifting it off that pin.
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "react-native-svg"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      # Majors gated by the Expo toolchain rather than pinned by the SDK.
      # eslint: eslint-config-expo pulls in eslint-plugin-react, whose eslint
      # peer range stops at ^9.7; under eslint 10 it crashes loading
      # `react/display-name`. Lift this once eslint-config-expo supports 10.
      # @types/jest: jest-expo runs jest 29, so jest 30 types describe an API
      # the test runner does not have. It moves with jest-expo's jest major.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # test-renderer: its minor line tracks the React minor it renders with
      # (1.2 is React 19.2, 1.3 is React 19.3), so a minor bump is a React
      # upgrade in disguise. Move it with the SDK's react pin, not on its own.
      - dependency-name: "test-renderer"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Scans .github/workflows/. Keeps actions/checkout, setup-node, setup-uv,
  # astral-sh, and supabase/setup-cli current. Note this bumps the action *ref*
  # only - the pinned SUPABASE_CLI_VERSION input in tests.yml is a manual bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
