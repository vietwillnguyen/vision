name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # Pull Supabase's public GHCR image mirror authenticated on a cold image cache
  # (.github/actions/supabase-images).
  packages: read

env:
  # Pinned deliberately. `version: latest` let the Supabase CLI - and with it the
  # Postgres/storage/auth images `supabase start` boots - change underneath CI
  # with no commit, so a green build could go red with nothing in the diff. Bump
  # this in its own PR so a CLI regression is bisectable. Dependabot tracks
  # action *refs*, not action *inputs*, so this bump stays manual.
  #
  # Bumping it also means updating .github/supabase-images.txt, the images that
  # version boots: CI serves them from a cache and blocks public.ecr.aws and
  # its ghcr.io and Docker Hub fallbacks, so a stale list fails loudly rather
  # than pulling.
  SUPABASE_CLI_VERSION: "2.109.0"
  # With [experimental.pgdelta] enabled in supabase/config.toml (kept for
  # developers' `db diff`), `supabase start` runs a one-off edge-runtime
  # container after migrating to cache a pg-delta catalog that only `db diff`
  # reads - a 1.1GB image pull per job for nothing CI uses. The CLI reads
  # SUPABASE_-prefixed env as config overrides, so CI turns it off here only.
  SUPABASE_EXPERIMENTAL_PGDELTA_ENABLED: "false"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test scripts/ci
        # Stubbed docker; no daemon or network.
        run: scripts/ci/tests/test-supabase-images.sh

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Python 3.11 is the declared floor; the device runs trixie (Python 3.13). Test on the floor.
          python-version: "3.11"
          enable-cache: true
      - name: Run pytest
        run: uv run --locked --extra dev pytest

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install ffmpeg
        # tests/test_ffmpeg_media_live.py runs the real media adapter against
        # generated pendant-shaped segments; without ffmpeg it would skip.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run pytest
        run: uv run --locked --extra dev pytest

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Provide Supabase images
        # Anonymous pulls from public.ecr.aws (the CLI's default registry) hit
        # `toomanyrequests` on shared runners. This loads every image from the
        # Actions cache, or seeds it from Supabase's GHCR mirror on a miss, and
        # then blocks public.ecr.aws and its ghcr.io and Docker Hub fallbacks for
        # the rest of the job.
        uses: ./.github/actions/supabase-images
        with:
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase
        working-directory: .
        # imgproxy is pulled whenever storage is enabled but only started with
        # [storage.image_transformation], which config.toml leaves off, so
        # excluding it changes no running service and skips a 250MB image.
        run: supabase start -x imgproxy
      - name: Verify Supabase images
        working-directory: .
        # Every running container must use an image from the manifest the
        # previous steps cached; anything else means the CLI pin moved on
        # without .github/supabase-images.txt.
        run: scripts/ci/supabase-images.sh verify
      - name: Run pgTAP database tests
        working-directory: .
        # The database contract - RLS policies, table grants, storage bucket
        # policies - that every other subsystem codes against. Kept as a step in
        # this job rather than a dedicated `database` job: the suites take ~1s,
        # so a separate job would spend a whole third `supabase start` to save
        # nothing off the critical path. This is already the database job, and
        # the step name makes a failure here unambiguous against the pytest step
        # below. Ordered before pytest because it is the fast fail, and because
        # each suite wraps itself in begin/rollback, so it leaves the freshly
        # migrated database untouched for the pytest run.
        #
        # `supabase test db` creates the pgtap extension itself - no migration
        # declares it, and a plain `supabase start` is enough.
        run: supabase test db
      - name: Export local Supabase connection env
        working-directory: .
        # supabase status has no plain key=value output flag as of the CLI
        # version pinned above, so this maps its `-o env` NAME values to the
        # SUPABASE_* vars conftest.py's live_supabase_env fixture reads.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Run pytest
        # Zero-Docker contract tests (filename/marker round-trip, and the
        # pipeline's segment/reel row shapes against the generated schema
        # fixture) plus the live-Supabase RLS end-to-end and storage-ingestion
        # handoff tests, now that this job starts a real local Supabase
        # instance. The app side of the row-shape contract is the app job's
        # tsc step, not a test here. Realtime channel-error handling is covered
        # separately in the app job - see integration/README.md.
        run: uv run --locked --extra dev pytest
      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: supabase stop

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Provide Supabase images
        # Anonymous pulls from public.ecr.aws (the CLI's default registry) hit
        # `toomanyrequests` on shared runners. This loads every image from the
        # Actions cache, or seeds it from Supabase's GHCR mirror on a miss, and
        # then blocks public.ecr.aws and its ghcr.io and Docker Hub fallbacks for
        # the rest of the job.
        uses: ./.github/actions/supabase-images
        with:
          cli-version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase
        working-directory: .
        # imgproxy is pulled whenever storage is enabled but only started with
        # [storage.image_transformation], which config.toml leaves off, so
        # excluding it changes no running service and skips a 250MB image.
        run: supabase start -x imgproxy
      - name: Verify Supabase images
        working-directory: .
        # Every running container must use an image from the manifest the
        # previous steps cached; anything else means the CLI pin moved on
        # without .github/supabase-images.txt.
        run: scripts/ci/supabase-images.sh verify
      - name: Export local Supabase connection env
        working-directory: .
        # Same NAME mapping as the integration job, so useDeviceStatus.live.test.tsx's
        # SUPABASE_* checks see a real instance instead of skipping.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
        env:
          # A transient registry ECONNRESET failed the post-merge run for PR #11
          # (issue #12); npm's default of 2 fetch retries is too few to ride out
          # a brief network blip even with the setup-node cache warm.
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
      - name: Verify generated database types are current
        working-directory: .
        # The committed app/src/generated/database.ts and the Python contract test's
        # schema fixture are both generated from the migrations by this script.
        # Regenerating here against the instance this job already started and
        # failing on a diff is what keeps them honest: a migration that lands
        # without a regeneration reddens the build instead of leaving the app
        # type-checking against a schema the database no longer has.
        run: |
          scripts/gen-db-types.sh
          git diff --exit-code -- app/src/generated/database.ts integration/tests/fixtures/public_schema.json
      - name: Type-check
        # Gates the app half of the row-shape contract: with a
        # createClient<Database> client, a hook that reads a column the schema
        # does not have is a compile error. Also runs in lint.yml, which needs
        # no Docker; this copy fails alongside the regeneration check above so a
        # schema change and its fallout show up in one job.
        run: npx tsc --noEmit
      - name: Run jest
        run: npx jest --ci
      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: supabase stop
      - name: Web bundle smoke check
        # Catches native-only modules (expo-media-library, expo-file-system,
        # expo-video-thumbnails) reintroduced at module top-level, which crash
        # the web bundle at load time but are invisible to jest (never bundles
        # for web). No secrets needed - export doesn't connect to Supabase.
        run: npx expo export --platform web --output-dir /tmp/web-export-smoke
