name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned deliberately. `version: latest` let the Supabase CLI - and with it the
  # Postgres/storage/auth images `supabase start` boots - change underneath CI
  # with no commit, so a green build could go red with nothing in the diff. Bump
  # this in its own PR so a CLI regression is bisectable. Dependabot tracks
  # action *refs*, not action *inputs*, so this bump stays manual.
  SUPABASE_CLI_VERSION: "2.109.0"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Device target is Python 3.11 on Raspberry Pi OS Bookworm; test on the floor.
          python-version: "3.11"
          enable-cache: true
      - name: Run pytest
        run: uv run --locked --extra dev pytest

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run pytest
        run: uv run --locked --extra dev pytest

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase
        working-directory: .
        run: supabase start
      - name: Run pgTAP database tests
        working-directory: .
        # The database contract - RLS policies, table grants, storage bucket
        # policies - that every other subsystem codes against. Kept as a step in
        # this job rather than a dedicated `database` job: the suites take ~1s,
        # so a separate job would spend a whole third `supabase start` to save
        # nothing off the critical path. This is already the database job, and
        # the step name makes a failure here unambiguous against the pytest step
        # below. Ordered before pytest because it is the fast fail, and because
        # each suite wraps itself in begin/rollback, so it leaves the freshly
        # migrated database untouched for the pytest run.
        #
        # `supabase test db` creates the pgtap extension itself - no migration
        # declares it, and a plain `supabase start` is enough.
        run: supabase test db
      - name: Export local Supabase connection env
        working-directory: .
        # supabase status has no plain key=value output flag as of the CLI
        # version pinned above, so this maps its `-o env` NAME values to the
        # SUPABASE_* vars conftest.py's live_supabase_env fixture reads.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Run pytest
        # Zero-Docker contract tests (filename/marker round-trip, segments/reels
        # row-shape vs. migrations and app hooks) plus the live-Supabase RLS
        # end-to-end and storage-ingestion handoff tests, now that this job
        # starts a real local Supabase instance. Realtime channel-error
        # handling is covered separately in the app job - see integration/README.md.
        run: uv run --locked --extra dev pytest
      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: supabase stop

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase
        working-directory: .
        run: supabase start
      - name: Export local Supabase connection env
        working-directory: .
        # Same NAME mapping as the integration job, so useDeviceStatus.live.test.tsx's
        # SUPABASE_* checks see a real instance instead of skipping.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
        env:
          # A transient registry ECONNRESET failed the post-merge run for PR #11
          # (issue #12); npm's default of 2 fetch retries is too few to ride out
          # a brief network blip even with the setup-node cache warm.
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run jest
        run: npx jest --ci
      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: supabase stop
      - name: Web bundle smoke check
        # Catches native-only modules (expo-media-library, expo-file-system,
        # expo-video-thumbnails) reintroduced at module top-level, which crash
        # the web bundle at load time but are invisible to jest (never bundles
        # for web). No secrets needed - export doesn't connect to Supabase.
        run: npx expo export --platform web --output-dir /tmp/web-export-smoke
