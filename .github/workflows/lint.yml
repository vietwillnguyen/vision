name: lint

# Deliberately unfiltered on pull_request: unlike tests.yml, which only runs
# for PRs targeting an explicit branch list, this must also run on PRs stacked
# onto a feature branch - shell, Python and app changes all land there first.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shellcheck is available
        # Preinstalled on the ubuntu-latest runner image; install as a fallback
        # so a runner image change fails loudly here rather than silently
        # skipping the lint. An explicit `if` rather than `a || b && c`, which
        # groups as `(a || b) && c` and would run the install on every path -
        # including the common one, where the runner's apt lists are cleaned
        # and an install with no preceding update fails the job outright.
        run: |
          if ! shellcheck --version; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: ShellCheck
        # These are every file in the repo carrying a shell shebang. Add new
        # ones here - `git ls-files | xargs -r awk 'FNR==1 && /^#!.*sh/'` lists them.
        run: |
          shellcheck --severity=style \
            docs/superpowers/evidence/app-jest-container-flake/run-loaded.sh \
            docs/superpowers/evidence/audio-capture/mixed_reel_before.sh \
            docs/superpowers/evidence/dependabot-triage/seed-screens.sh \
            docs/superpowers/evidence/derooted-recorder/sim/run.sh \
            docs/superpowers/evidence/derooted-recorder/sim/stubs/* \
            docs/superpowers/evidence/provisioning-led-spi-audio/sim/failure-paths.sh \
            docs/superpowers/evidence/provisioning-led-spi-audio/sim/run.sh \
            docs/superpowers/evidence/provisioning-led-spi-audio/sim/stubs/* \
            firmware/scripts/setup-device.sh \
            firmware/tests/fixtures/raspi-config \
            scripts/ci/supabase-images.sh \
            scripts/ci/tests/test-supabase-images.sh \
            scripts/gen-db-types.sh \
            scripts/hooks/pre-commit \
            scripts/hooks/tests/test-pre-commit.sh

  # Neither job below needs Docker or a Supabase instance: ruff and mypy read
  # source only, and the app job type-checks and lints without bundling or
  # running.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [firmware, pipeline, integration]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Python 3.11 is the floor all three packages declare, same as
          # tests.yml - lint on the oldest interpreter the code must support.
          # The device itself runs Raspberry Pi OS trixie (Python 3.13).
          python-version: "3.11"
          enable-cache: true
      - name: Ruff lint
        run: uv run --locked --extra dev ruff check .
      - name: Ruff format
        run: uv run --locked --extra dev ruff format --check .
      - name: Mypy
        # Paths come from each pyproject.toml's [tool.mypy] files setting.
        run: uv run --locked --extra dev mypy

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          # Same transient-registry mitigation as tests.yml (issue #12).
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
