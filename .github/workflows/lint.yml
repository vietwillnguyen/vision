name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No job here needs Docker or a Supabase instance: ruff and mypy read source
  # only, and the app job type-checks and lints without bundling or running.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [firmware, pipeline, integration]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Python 3.11 is the floor all three packages declare, same as
          # tests.yml - lint on the oldest interpreter the code must support.
          # The device itself runs Raspberry Pi OS trixie (Python 3.13).
          python-version: "3.11"
          enable-cache: true
      - name: Ruff lint
        run: uv run --locked --extra dev ruff check .
      - name: Ruff format
        run: uv run --locked --extra dev ruff format --check .
      - name: Mypy
        # Paths come from each pyproject.toml's [tool.mypy] files setting.
        run: uv run --locked --extra dev mypy

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          # Same transient-registry mitigation as tests.yml (issue #12).
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
