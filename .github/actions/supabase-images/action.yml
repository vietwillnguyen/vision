name: Supabase images
description: >-
  Make every Docker image in .github/supabase-images.txt present locally under
  the public.ecr.aws name the Supabase CLI resolves, from the Actions cache when
  warm and from Supabase's GHCR mirror when cold, then block public.ecr.aws so
  nothing later in the job can pull from it or from the GHCR and Docker Hub
  fallbacks the CLI tries next. Run before `supabase start`.

inputs:
  cli-version:
    description: The pinned Supabase CLI version (tests.yml SUPABASE_CLI_VERSION); part of the cache key.
    required: true

runs:
  using: composite
  steps:
    - name: Restore Supabase image cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/supabase-images/images.tar
        key: supabase-images-${{ runner.os }}-${{ runner.arch }}-cli${{ inputs.cli-version }}-${{ hashFiles('.github/supabase-images.txt') }}

    - name: Load cached Supabase images
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/supabase-images/images.tar"
        echo "archive: $(du -h "$archive" | cut -f1)"
        time scripts/ci/supabase-images.sh load "$archive"
        rm -f "$archive"

    - name: Log in to GHCR
      # Only a cold cache pulls. Authenticated GHCR pulls from Actions use the
      # job's own token; an anonymous pull still works for these public images,
      # so a failed login is a warning, not a failure.
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
        GHCR_USER: ${{ github.actor }}
      run: |
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
          || echo "::warning::GHCR login failed; seeding Supabase images anonymously"

    - name: Seed Supabase images
      # A no-op that touches no registry when the cache loaded every image.
      shell: bash
      run: time scripts/ci/supabase-images.sh seed

    - name: Log out of GHCR
      # Seeding was the token's only use; drop it from ~/.docker/config.json so
      # later steps, including test code, do not inherit it.
      if: always() && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: docker logout ghcr.io || echo "::warning::GHCR logout failed"

    - name: Archive Supabase images for the cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: time scripts/ci/supabase-images.sh save "$RUNNER_TEMP/supabase-images/images.tar"

    - name: Save Supabase image cache
      # Saved before any test runs, so a red test still leaves a warm cache. When
      # the integration and app jobs both start cold, one of them saves and the
      # other logs that the key is already being created.
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/supabase-images/images.tar
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Block Supabase image registries
      # Every image the job needs is local now, so the CLI has no reason to
      # contact a registry. It pulls from public.ecr.aws, and when that fails it
      # quietly falls back to ghcr.io and then Docker Hub (`supabase test db`
      # does), so all three resolve to an unroutable address: a stale manifest
      # becomes an immediate, explained failure instead of a pull that works
      # until a quota runs out. Seeding, the only ghcr.io use, is done, and no
      # later step pulls from Docker Hub (registry-1.docker.io serves docker.io).
      # The probes prove the Docker daemon, which does the pulling, sees the block.
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/supabase-images/images.tar"
        for host in public.ecr.aws ghcr.io registry-1.docker.io; do
          printf '0.0.0.0 %s\n:: %s\n' "$host" "$host" | sudo tee -a /etc/hosts >/dev/null
        done
        for registry in public.ecr.aws ghcr.io docker.io; do
          if out="$(docker pull "$registry/supabase/postgres:block-probe" 2>&1)"; then
            echo "::error::$registry is still reachable from the Docker daemon"
            exit 1
          fi
          echo "probe: $out"
          case "$out" in
            *"connection refused"*|*"0.0.0.0"*|*"[::]"*) echo "$registry blocked for this job" ;;
            *) echo "::error::unexpected probe failure, $registry block not confirmed: $out"; exit 1 ;;
          esac
        done
