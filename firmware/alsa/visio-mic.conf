# ALSA capture device for the pendant's INMP441 I2S MEMS microphone.
#
# Install as /etc/asound.conf (or include it from there) on the Pi, after
# enabling the I2S microphone in /boot/firmware/config.txt with:
#
#   dtoverlay=adau7002-simple
#
# That overlay (raspberrypi/linux rpi-6.12.y, arch/arm/boot/dts/overlays) makes
# the Pi the I2S clock producer on GPIO 18 (BCLK), GPIO 19 (LRCLK/WS) and reads
# GPIO 20 (DIN), and registers a capture-only sound card named "adau7002" that
# accepts 2 channels of S16_LE..S32_LE at 8-96 kHz. The INMP441 needs no
# driver of its own: it is clocked by the Pi and only shifts samples out.
#
# The INMP441 drives only one slot of each stereo frame: the left one with its
# L/R pin tied to GND, as wired here. The right slot is always zero, so the
# plug below captures the card in its native stereo S32_LE at 48 kHz and keeps
# only the left channel, rather than averaging speech with silence.
#
# rpicam-vid records from this device with
#   --libav-audio --audio-source alsa --audio-device visio_mic --audio-channels 1
# which is what the firmware passes (VISIO_AUDIO_DEVICE defaults to visio_mic).
# Check it on the Pi with: arecord -D visio_mic -f S16_LE -r 48000 -c 1 -d 5 test.wav

pcm.visio_mic {
    type plug
    slave {
        pcm "hw:CARD=adau7002,DEV=0"
        format S32_LE
        rate 48000
        channels 2
    }
    # Output channel 0 (mono) takes input channel 0 (the left slot) at unity.
    ttable.0.0 1
}
