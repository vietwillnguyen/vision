[project]
name = "visio-integration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "visio-recorder",
    "visio-pipeline",
    "supabase>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
]

[tool.uv.sources]
visio-recorder = { path = "../firmware" }
visio-pipeline = { path = "../pipeline" }

# Shared rule set lives in the repo-root ruff.toml so the three packages
# cannot drift apart; see its header comment.
[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
