[project]
name = "visio-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "supabase>=2.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
]

# Shared rule set lives in the repo-root ruff.toml so the three packages
# cannot drift apart; see its header comment.
[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
